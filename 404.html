<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseHaven</title>
    <link rel="icon" type="image/png" sizes="184x184" href="images/brand.png" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="footer.css" />
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="404.css" />

    <script src="https://unpkg.com/lucide@0.468.0" defer></script>
    <script src="components/component.js" defer></script>
    <script src="global.js" defer></script>
  </head>

  <body>
    <!-- Pulse Haven 404 Page -->
    <main class="error-page">
      <!-- Background Decorations -->
      <div class="error-bg" aria-hidden="true">
        <span class="error-orb error-orb-one"></span>
        <span class="error-orb error-orb-two"></span>
        <span class="error-orb error-orb-three"></span>

        <span class="error-line error-line-one"></span>
        <span class="error-line error-line-two"></span>

        <span class="error-circle error-circle-one"></span>
        <span class="error-circle error-circle-two"></span>

        <!-- Floating Medical Cards -->
        <div class="error-floating-card error-card-one">
          <i data-lucide="heart-pulse"></i>
        </div>

        <div class="error-floating-card error-card-two">
          <i data-lucide="file-heart"></i>
        </div>

        <div class="error-floating-card error-card-three">
          <i data-lucide="activity"></i>
        </div>

        <!-- Floating Documents -->
        <div class="error-document error-document-one">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="error-document error-document-two">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <!-- Top Controls -->
      <div class="error-controls">
        <button
          type="button"
          class="rtl-toggle"
          id="rtlToggle"
          aria-label="Toggle right-to-left layout"
          aria-pressed="false"
        >
          RTL
        </button>

        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <i data-lucide="moon"></i>
        </button>
      </div>

      <!-- Main Error Content -->
      <section class="error-content" aria-labelledby="errorTitle">
        <!-- Brand -->
        <a href="/home1.html" class="error-brand" aria-label="Pulse Haven Home">
          <img
            src="../images/brand.png"
            alt="Pulse Haven Logo"
            class="error-logo"
          />

          <span class="error-brand-text">
            <span class="error-brand-name">
              <span class="error-brand-primary">Pulse</span
              ><span class="error-brand-secondary">Haven</span>
            </span>

            <span class="error-tagline"> Where Care Matters </span>
          </span>
        </a>

        <!-- 404 Error Number -->
        <div class="error-number-wrapper">
          <h1 class="error-number" aria-label="404">
            <span class="error-four error-four-one">4</span>

            <!-- Animated Zero -->
            <span class="error-zero" aria-hidden="true">
              <span class="error-zero-ring">
                <span class="error-zero-inner">
                  <i data-lucide="compass"></i>
                </span>
              </span>
            </span>

            <span class="error-four error-four-two">4</span>
          </h1>
        </div>

        <!-- Page Not Found Badge -->
        <div class="error-eyebrow">
          <span class="error-eyebrow-dot"></span>
          <span>PAGE NOT FOUND</span>
        </div>

        <!-- Error Heading -->
        <div class="error-heading">
          <h2 id="errorTitle">
            This Page Seems to Be
            <span>Missing</span>
          </h2>

          <p class="error-description">
            The page you're looking for may have moved, been removed, or the
            link might be incorrect. Let's get you back on track.
          </p>
        </div>

        <!-- Back to Home -->
        <div class="error-actions">
          <a href="/home1.html" class="error-home-btn">
            <i data-lucide="house"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </section>
    </main>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
