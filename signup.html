<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseHaven</title>
    <link rel="icon" type="image/png" sizes="184x184" href="images/brand.png" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="footer.css" />
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="signup.css" />

    <script src="https://unpkg.com/lucide@0.468.0" defer></script>
    <script src="components/component.js" defer></script>
    <script src="global.js" defer></script>
    <script src="signup.js" defer></script>
  </head>

  <body>
    <main class="signup-page">
      <!-- Animated Background -->
      <div class="signup-bg-animation" aria-hidden="true">
        <div class="signup-bg-orb signup-bg-orb-one"></div>
        <div class="signup-bg-orb signup-bg-orb-two"></div>
        <div class="signup-bg-orb signup-bg-orb-three"></div>

        <div class="signup-bg-grid"></div>

        <div class="signup-bg-ring signup-bg-ring-one"></div>
        <div class="signup-bg-ring signup-bg-ring-two"></div>

        <div class="signup-bg-line signup-bg-line-one"></div>
        <div class="signup-bg-line signup-bg-line-two"></div>

        <div class="signup-bg-card signup-bg-card-one">
          <i data-lucide="heart-pulse"></i>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="signup-bg-card signup-bg-card-two">
          <i data-lucide="activity"></i>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="signup-bg-symbol signup-bg-symbol-one">
          <i data-lucide="heart-pulse"></i>
        </div>

        <div class="signup-bg-symbol signup-bg-symbol-two">
          <i data-lucide="shield-check"></i>
        </div>

        <div class="signup-bg-dot signup-bg-dot-one"></div>
        <div class="signup-bg-dot signup-bg-dot-two"></div>
        <div class="signup-bg-dot signup-bg-dot-three"></div>
        <div class="signup-bg-dot signup-bg-dot-four"></div>
      </div>

      <!-- Top-right Controls -->
      <div class="signup-page-controls">
        <button
          type="button"
          class="signup-control-btn"
          id="themeToggle"
          aria-label="Switch to dark mode"
          title="Toggle theme"
        >
          <i data-lucide="moon"></i>
        </button>

        <button
          type="button"
          class="signup-control-btn"
          id="rtlToggle"
          aria-label="Switch to right-to-left layout"
          aria-pressed="false"
          title="Toggle RTL"
        >
          <i data-lucide="languages"></i>
          <span>RTL</span>
        </button>
      </div>

      <!-- Signup Card -->
      <section class="signup-container" aria-labelledby="signupTitle">
        <!-- Brand -->
        <div class="signup-brand">
          <a
            href="home1.html"
            class="signup-brand-link"
            aria-label="Pulse Haven Home"
          >
            <div class="signup-brand-row">
              <img
                src="../images/brand.png"
                alt="Pulse Haven Logo"
                class="signup-logo-image"
              />

              <div class="signup-brand-text">
                <h1 class="signup-brand-name">
                  <span class="signup-brand-primary">Pulse</span>
                  <span class="signup-brand-secondary">Haven</span>
                </h1>

                <p class="signup-brand-tagline">where care matters</p>
              </div>
            </div>
          </a>
        </div>

        <!-- Intro -->
        <div class="signup-intro">
          <span class="signup-eyebrow">PATIENT PORTAL</span>

          <h2 id="signupTitle">Create Your Account</h2>

          <p>
            Start your health journey with convenient home vitals monitoring and
            personalized care.
          </p>
        </div>

        <!-- Signup Form -->
        <form class="signup-form" id="signupForm" action="#" method="post">
          <!-- Full Name -->
          <div class="signup-field">
            <label for="signupFullName">Full Name</label>

            <div class="signup-input-wrapper">
              <i data-lucide="user" aria-hidden="true"></i>

              <input
                type="text"
                id="signupFullName"
                name="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="signup-field">
            <label for="signupEmail">Email Address</label>

            <div class="signup-input-wrapper">
              <i data-lucide="mail" aria-hidden="true"></i>

              <input
                type="email"
                id="signupEmail"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- Password Fields -->
          <div class="signup-password-row">
            <!-- Password -->
            <div class="signup-field">
              <label for="signupPassword">Password</label>

              <div class="signup-input-wrapper">
                <i data-lucide="lock-keyhole" aria-hidden="true"></i>

                <input
                  type="password"
                  id="signupPassword"
                  name="password"
                  placeholder="Create password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />

                <button
                  type="button"
                  class="signup-password-toggle"
                  id="signupPasswordToggle"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <i data-lucide="eye"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="signup-field">
              <label for="signupConfirmPassword">Confirm Password</label>

              <div class="signup-input-wrapper">
                <i data-lucide="shield-check" aria-hidden="true"></i>

                <input
                  type="password"
                  id="signupConfirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />

                <button
                  type="button"
                  class="signup-password-toggle"
                  id="signupConfirmPasswordToggle"
                  aria-label="Show confirm password"
                  aria-pressed="false"
                >
                  <i data-lucide="eye"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Terms and Conditions -->
          <div class="signup-terms">
            <input type="checkbox" id="signupTerms" name="terms" required />

            <label for="signupTerms">
              I agree to the
              <a href="../terms.html">Terms &amp; Conditions</a>
              and
              <a href="../privacy.html">Privacy Policy</a>
            </label>
          </div>

          <!-- Create Account -->
          <button type="submit" class="signup-submit-btn">
            <span>Create Account</span>
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>

          <!-- Divider -->
          <div class="signup-divider">
            <span></span>
            <p>OR SIGN UP WITH</p>
            <span></span>
          </div>

          <!-- Social Signup -->
          <div class="signup-social-options">
            <!-- Google -->
            <button
              type="button"
              class="signup-social-btn signup-google-btn"
              aria-label="Sign up with Google"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"
                  transform="translate(0 5)"
                />
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 37.97 46.98 31.86 46.98 24.55Z"
                  transform="translate(0 0)"
                />
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.2a23.9 23.9 0 0 0 0 21.57l7.98-6.19Z"
                  transform="translate(0 0)"
                />
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.45-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
                  transform="translate(0 0)"
                />
              </svg>
              <span>Google</span>
            </button>

            <!-- Apple -->
            <button
              type="button"
              class="signup-social-btn signup-apple-btn"
              aria-label="Sign up with Apple"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M16.365 1.43c0 1.14-.417 2.207-1.11 3.006-.748.858-1.97 1.52-3.007 1.43-.13-1.08.4-2.22 1.11-3.006.78-.86 2.14-1.5 3.007-1.43ZM20.94 17.06c-.49 1.1-.72 1.59-1.35 2.56-.88 1.35-2.12 3.04-3.65 3.05-1.35.01-1.7-.89-3.54-.88-1.84.01-2.23.89-3.58.88-1.53-.01-2.71-1.54-3.59-2.89-2.45-3.75-2.71-8.15-1.2-10.5 1.07-1.67 2.76-2.65 4.35-2.65 1.62 0 2.64.89 3.99.89 1.31 0 2.11-.89 4-.89 1.43 0 2.94.78 4.01 2.12-3.53 1.94-2.96 6.99.56 8.31Z"
                />
              </svg>
              <span>Apple</span>
            </button>
          </div>
        </form>

        <!-- Sign In -->
        <div class="signup-login-link">
          <p>
            Already have an account?
            <a href="./login.html">Sign In</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
